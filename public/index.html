<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Hubungi petugas Jasa Raharja Care melalui live chat.">
    <meta name="theme-color" content="#f3f8fc">
    <title>Helpdesk JRCare</title>
    <link rel="icon" href="/assets/jrcare-logo.png" type="image/png">
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/visitor.js"></script>
  </head>
  <body class="visitor-page">
    <header class="site-header">
      <div class="site-bar">
        <a class="brand" href="/" aria-label="JRCare, live chat">
          <img class="brand-mark" src="/assets/jrcare-logo.png" alt="" width="365" height="305">
          <span><strong>JRCare</strong><small>Helpdesk</small></span>
        </a>
        <a class="header-link" href="/petugas">Portal petugas</a>
      </div>
    </header>

    <main class="visitor-layout">
      <section class="visitor-intro" aria-labelledby="visitor-title">
        <div class="intro-top">
          <span class="intro-label">Jasa Raharja Care</span>
          <span class="hero-emblem" aria-hidden="true"><img src="/assets/jrcare-logo.png" alt="" width="365" height="305"></span>
        </div>
        <div class="intro-copy">
          <h1 id="visitor-title">Ada yang bisa <span>kami bantu?</span></h1>
          <p>Tanya petugas kami soal santunan dan layanan Jasa Raharja.</p>
        </div>
        <div class="quick-topics" role="group" aria-labelledby="topics-title">
          <p id="topics-title">Pilih topik untuk mulai</p>
          <div class="topic-list">
            <button type="button" class="topic" data-topic="Halo, saya ingin bertanya tentang pengajuan santunan." disabled>Pengajuan santunan</button>
            <button type="button" class="topic" data-topic="Halo, saya ingin menanyakan status pengajuan saya." disabled>Status pengajuan</button>
            <button type="button" class="topic" data-topic="Halo, saya membutuhkan informasi tentang layanan Jasa Raharja." disabled>Informasi layanan</button>
          </div>
        </div>
      </section>

      <section class="panel chat-card" id="customer-chat" aria-labelledby="chat-title" data-state="loading">
        <header class="chat-card-header">
          <span class="chat-symbol" aria-hidden="true"></span>
          <div>
            <h2 id="chat-title">Live chat JRCare</h2>
            <p id="visitor-status" role="status">Menyambungkan…</p>
          </div>
        </header>

        <div id="visitor-loading" class="chat-loading" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <form id="start-form" class="start-form" method="post" hidden>
          <label for="visitor-name">Nama Anda</label>
          <input id="visitor-name" name="name" autocomplete="name" maxlength="80" placeholder="Masukkan nama" required>
          <label for="visitor-first">Pesan</label>
          <textarea id="visitor-first" name="message" rows="4" maxlength="2000" placeholder="Tuliskan pertanyaan Anda" required></textarea>
          <button class="primary" type="submit">Mulai chat</button>
        </form>

        <div id="visitor-thread" class="visitor-thread" hidden>
          <ol id="visitor-messages" class="messages" role="log" aria-label="Percakapan" aria-relevant="additions"></ol>
          <form id="visitor-reply" class="composer" method="post" hidden>
            <label class="sr-only" for="visitor-message">Pesan</label>
            <textarea id="visitor-message" name="message" rows="2" maxlength="2000" placeholder="Tulis pesan Anda" required></textarea>
            <button class="primary" type="submit">Kirim</button>
          </form>
          <div id="visitor-closed" class="closed-notice" hidden>
            <p>Chat ini sudah selesai.</p>
            <button id="new-chat" class="secondary" type="button">Mulai chat baru</button>
          </div>
        </div>
        <p id="visitor-error" class="notice" role="status" hidden></p>
      </section>
    </main>
  </body>
</html>
